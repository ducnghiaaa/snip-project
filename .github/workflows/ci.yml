name: CI

on:
  push:
    branches: [project-2-intermediate]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [project-2-intermediate]
    paths-ignore: ["**.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: snip
          POSTGRES_PASSWORD: snip
          POSTGRES_DB: snip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snip"
          --health-interval 5s --health-timeout 3s --health-retries 5
      cache:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://snip:snip@localhost:5432/snip
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q